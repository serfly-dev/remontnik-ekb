<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управеления - CMS</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">

</head>

<body>

  <a class="skip-link visually-hidden" href="#main">Перейти к содержанию</a>

  <header class="admin-header">
    <div class="container">
      <div class="admin-header__inner">
        <a href="/" class="logo" aria-label="На главную">
          <span class="logo__type">
            <span class="logo__name">РемонтНик квартир</span>
            <span class="logo__role">Админ-панель</span>
          </span>
        </a>
        <div class="admin-header__right">
          <span class="admin-header__user" id="adminUser">—</span>
          <button class="btn btn--ghost" id="logoutBtn">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container">

      <!-- Stats -->
      <section class="admin-stats" aria-labelledby="stats-title">
        <h2 class="visually-hidden" id="stats-title">Статистика</h2>
        <div class="admin-stats__grid">
          <div class="stat-card">
            <span class="stat-card__num" id="statTotal">—</span>
            <span class="stat-card__label">Всего заявок</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" id="statNew">—</span>
            <span class="stat-card__label">Новые</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" id="statProgress">—</span>
            <span class="stat-card__label">В работе</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" id="statCompleted">—</span>
            <span class="stat-card__label">Завершены</span>
          </div>
        </div>
      </section>

      <!-- Sections Editor -->
      <section class="admin-sections" aria-labelledby="sections-title">
        <h2 class="visually-hidden" id="sections-title">Редактор секций</h2>
        <nav class="admin-tabs" id="sectionsTabs" role="tablist" aria-label="Секции сайта"></nav>
        <div class="section-editor" id="sectionEditor" aria-hidden="true"></div>
      </section>

      <!-- Table -->
      <section class="admin-table-section" id="applicationsSection" aria-labelledby="applications-title" hidden>
        <div class="admin-table-section__head">
          <h2 class="section-title" id="applications-title">Заявки</h2>
          <div class="admin-table-section__actions">
            <button class="btn btn--ghost" id="refreshBtn">Обновить</button>
          </div>
        </div>

        <!-- Toolbar (filters) -->
        <section class="admin-toolbar" aria-label="Фильтры и поиск">
          <div class="admin-toolbar__search">
            <label for="searchInput" class="visually-hidden">Поиск по имени или телефону</label>
            <input type="search" id="searchInput" class="admin-toolbar__input"
              placeholder="Поиск по имени или телефону…">
          </div>
          <div class="admin-toolbar__filters">
            <label for="statusFilter" class="visually-hidden">Фильтр по статусу</label>
            <select id="statusFilter" class="admin-toolbar__select">
              <option value="">Все статусы</option>
              <option value="new">Новая</option>
              <option value="in_progress">В работе</option>
              <option value="completed">Завершена</option>
              <option value="cancelled">Отменена</option>
            </select>
            <label for="sortSelect" class="visually-hidden">Сортировка</label>
            <select id="sortSelect" class="admin-toolbar__select">
              <option value="created_at:desc">По дате (новые)</option>
              <option value="created_at:asc">По дате (старые)</option>
              <option value="name:asc">По имени (А–Я)</option>
              <option value="status:asc">По статусу</option>
            </select>
          </div>
        </section>

        <!-- Loading state -->
        <div class="admin-table-section__loading" id="loadingState">
          <span class="spinner"></span>
          <span>Загрузка заявок…</span>
        </div>

        <!-- Empty state -->
        <div class="admin-table-section__empty" id="emptyState" hidden>
          <p class="admin-table-section__empty-text">Нет заявок</p>
        </div>

        <!-- Error state -->
        <div class="admin-table-section__error" id="errorState" hidden>
          <p class="admin-table-section__error-text">Ошибка при загрузке заявок</p>
          <button class="btn btn--ghost" id="retryBtn">Попробовать снова</button>
        </div>

        <!-- Table -->
        <div class="admin-table-wrapper" id="tableWrapper" hidden>
          <table class="admin-table" id="applicationsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Статус</th>
                <th>Дата</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
          </table>
        </div>

        <!-- Pagination -->
        <nav class="admin-pagination" id="pagination" aria-label="Пагинация" hidden>
        </nav>
      </section>

    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal" hidden aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle">Заявка</h2>
        <button class="modal__close" id="modalClose" aria-label="Закрыть">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal__body" id="modalBody">
      </div>
      <div class="modal__foot" id="modalFoot">
        <div class="modal__status-group">
          <label for="statusSelect" class="modal__label">Статус</label>
          <select id="statusSelect" class="admin-toolbar__select">
            <option value="new">Новая</option>
            <option value="in_progress">В работе</option>
            <option value="completed">Завершена</option>
            <option value="cancelled">Отменена</option>
          </select>
        </div>
        <button class="btn btn--primary" id="saveStatusBtn">Сохранить</button>
        <button class="btn btn--danger" id="deleteStatusBtn">Удалить</button>
      </div>
    </div>
  </div>

  <script type="module" src="/admin/js/api.js"></script>
  <script type="module" src="/admin/js/sections.js"></script>
  <script type="module" src="/admin/js/applications.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- Crop Modal -->
  <div class="modal-overlay" id="cropModal" hidden aria-hidden="true" role="dialog" aria-labelledby="cropModalTitle">
    <div class="modal" id="cropModalContent">
      <div class="modal__head">
        <h2 class="modal__title" id="cropModalTitle">Обрезка изображения</h2>
        <button class="modal__close" id="cropModalClose" aria-label="Закрыть">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal__body">
        <div class="crop-container">
          <div class="crop-preview">
            <img id="cropImage" src="" alt="Изображение для обрезки">
          </div>
          <div class="crop-info">
            <p class="crop-aspect-ratio" id="cropAspectRatio"></p>
            <p class="crop-dimensions" id="cropDimensions"></p>
          </div>
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--ghost" id="cropCancelBtn">Отмена</button>
        <button class="btn btn--primary" id="cropConfirmBtn">Готово</button>
      </div>
    </div>
  </div>
</body>

</html>
