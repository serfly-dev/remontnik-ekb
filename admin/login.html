<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <link rel="stylesheet" href="/css/fonts.css?v=2">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">

</head>

<body>
  <main class="login-page">
    <div class="login-container">
      <div class="login-header">
        <a href="/" class="login-logo" aria-label="На главную">
          <span class="login-logo__mark">Перейти на сайт</span>
        </a>
        <h1 class="login-title">Вход в панель управления</h1>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Логин</label>
          <input type="text" id="username" name="username" class="form-input" autocomplete="username" required
            aria-required="true">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" id="password" name="password" class="form-input" autocomplete="current-password"
            required aria-required="true">
        </div>

        <button type="submit" class="btn btn--primary btn--block login-submit" id="loginSubmit">
          <span class="btn-text">Войти</span>
          <span class="btn-loader" hidden></span>
        </button>

        <div class="form-status" id="formStatus" role="alert" aria-live="polite"></div>
      </form>

      <div class="login-footer">
        <p>РемонтНик квартир</p>
      </div>
    </div>
  </main>

  <script src="/admin/js/auth.js"></script>
</body>

</html>
