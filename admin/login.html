<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в админку — Никита Начаткин</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@700&family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="login-page">
    <div class="login-container">
      <div class="login-header">
        <a href="/" class="login-logo" aria-label="На главную">
          <span class="login-logo__mark">NK</span>
          <span class="login-logo__type">
            <span class="login-logo__name">Никита Начаткин</span>
            <span class="login-logo__role">Административная панель</span>
          </span>
        </a>
        <h1 class="login-title">Вход в панель управления</h1>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Логин</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            autocomplete="username"
            required
            aria-required="true"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            autocomplete="current-password"
            required
            aria-required="true"
          >
        </div>

        <button type="submit" class="btn btn--primary btn--block login-submit" id="loginSubmit">
          <span class="btn-text">Войти</span>
          <span class="btn-loader" hidden></span>
        </button>

        <div class="form-status" id="formStatus" role="alert" aria-live="polite"></div>
      </form>

      <div class="login-footer">
        <p>Ремонт квартир — Никита Начаткин</p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
