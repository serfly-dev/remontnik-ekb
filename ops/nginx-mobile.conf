# Include inside the site's existing HTTPS server block, then run nginx -t.
# HTML is included by default. Already-compressed fonts/video/images are omitted.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
